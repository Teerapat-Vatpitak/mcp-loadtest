[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
report-name = "mcp-loadtest-ci"
store-success-output = false
store-failure-output = true

[profile.stress]
inherits = "ci"
retries = 0

[profile.stress.junit]
path = "junit.xml"
report-name = "mcp-loadtest-stress"
store-success-output = false
store-failure-output = true
