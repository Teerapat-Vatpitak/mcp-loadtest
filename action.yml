name: "mcp-loadtest"
# Marketplace requires < 125 chars. Longer pitch lives in README +
# docs/examples/ci-integration.md. (Install details: prebuilt binary,
# sha256-verified, cargo-install fallback.)
description: >-
  Load-test an MCP server in CI: deadlock probe, sustained load, cross-server
  compare, or doctor. Fails the job on regression.
author: "Teerapat Vatpitak"
branding:
  icon: "activity"
  color: "orange"

inputs:
  version:
    description: >-
      Release tag to install (e.g. "v0.1.0"). Defaults to the binary matching
      this Action release. "latest" may be requested explicitly, but is less
      reproducible.
    required: false
    default: "v0.1.0"
  command:
    description: >-
      Subcommand to run: "deadlock-probe" (default), "run", "cross", or
      "doctor". For "run", pass `--config <file>` via `args` — the server is
      defined in the TOML config.
    required: false
    default: "deadlock-probe"
  server:
    description: >-
      Server command string passed to --server, e.g. "python -m my_mcp".
      Ignored by `command: run` (the TOML config carries the server). Do not
      put credentials here: the value and parsed child argv remain visible to
      operating-system process inspection. Prefer environment-based auth. The
      Action redacts server identity from its reports, trace header, summary,
      diagnostics, and retained stderr, but cannot make process argv secret.
    required: true
  args:
    description: >-
      Extra CLI arguments as a JSON array of strings. Each array element is
      passed as one literal argument; shell syntax is never evaluated. Example:
      ["--tool","get_market_data","--args","{\"ticker\":\"AAPL\"}"].
      Output-directory flags are reserved for the Action and rejected. Do not
      place credentials here: redaction cannot sanitize arbitrary MCP server
      response content or operating-system process inspection.
    required: false
    default: "[]"
  baseline:
    description: >-
      Optional path to a baseline metrics.json. When set, the action also
      runs `mcp-loadtest compare <baseline> <current>/metrics.json` after a
      single-report `run` or `deadlock-probe` invocation and fails on
      regression. Rejected for `cross` (multiple reports) and `doctor` (none).
    required: false
    default: ""
  working-directory:
    description: "Directory to run the command in."
    required: false
    default: "."

outputs:
  report-dir:
    description: >-
      Exact directory created by this invocation for `run` and
      `deadlock-probe`; the private Action-owned report root for multi-report
      `cross`; empty for `doctor`. Never selected from a shared or pre-existing
      report root.
    value: ${{ steps.run.outputs.report-dir }}
  passed:
    description: >-
      "true" only when the command, report attribution, and optional compare
      all pass; "false" on validation, install, execution, discovery, or
      comparison failure.
    # `run` is never reached when installation fails. Keep the public output
    # fail-closed instead of exposing an ambiguous empty value in that case.
    value: ${{ steps.run.outputs.passed || 'false' }}

runs:
  using: "composite"
  steps:
    - name: Install mcp-loadtest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        repo="Teerapat-Vatpitak/mcp-loadtest"
        # shellcheck source=scripts/action-args.sh
        source "${GITHUB_ACTION_PATH}/scripts/action-args.sh"

        # --- resolve the release tag -----------------------------------------
        tag="${INPUT_VERSION}"
        if [ "$tag" = "latest" ]; then
          if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-}" ]; then
            tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
          else
            # Token is optional here (public repo) but lifts the rate limit.
            auth=()
            if [ -n "${GH_TOKEN:-}" ]; then
              auth=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
            tag="$(curl -fsSL --retry 3 "${auth[@]}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/latest" \
              | sed -n 's/^[[:space:]]*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*$/\1/p' \
              | head -n 1)"
          fi
        fi
        if [ -z "$tag" ]; then
          echo "::error::could not resolve a release tag for ${repo}"
          exit 1
        fi
        if ! mcp_loadtest_is_release_tag "$tag"; then
          # Do not interpolate an invalid caller value into workflow-command
          # output or an environment file.
          echo "::error::version must resolve to a stable tag such as v0.1.0"
          exit 2
        fi
        printf 'MCP_LOADTEST_VERSION=%s\n' "$tag" >> "$GITHUB_ENV"

        # --- map runner -> release target ------------------------------------
        target=""
        ext=""
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   target="x86_64-unknown-linux-gnu"; ext="tar.gz" ;;
          macOS-ARM64) target="aarch64-apple-darwin";     ext="tar.gz" ;;
          macOS-X64)   target="x86_64-apple-darwin";      ext="tar.gz" ;;
          Windows-X64) target="x86_64-pc-windows-msvc";   ext="zip" ;;
        esac

        if [ -z "$target" ]; then
          echo "no prebuilt binary for ${RUNNER_OS}/${RUNNER_ARCH} — falling back to cargo install --git"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo not found; install Rust (e.g. dtolnay/rust-toolchain@stable) before this action on ${RUNNER_OS}/${RUNNER_ARCH} runners"
            exit 1
          fi
          cargo install --git "https://github.com/${repo}" --tag "$tag" --locked mcp-loadtest-cli
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          exit 0
        fi

        # Asset names must match the packaging in .github/workflows/release.yml:
        #   mcp-loadtest-<tag>-<target>.{tar.gz|zip}  (+ ".sha256" sidecar)
        asset="mcp-loadtest-${tag}-${target}.${ext}"
        base="https://github.com/${repo}/releases/download/${tag}"
        temp_base="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        if ! dist="$(mktemp -d "${temp_base%/}/mcp-loadtest-dist.XXXXXX")"; then
          echo "::error::could not create a private install directory"
          exit 1
        fi
        if ! chmod 700 "$dist"; then
          echo "::error::could not restrict the private install directory"
          exit 1
        fi
        cd "$dist"

        # Unauthenticated on purpose: release downloads on a public repo need
        # no token, and the cross-host redirect to object storage rejects
        # requests that still carry an Authorization header.
        curl -fsSL --retry 3 -o "$asset" "${base}/${asset}"
        curl -fsSL --retry 3 -o "${asset}.sha256" "${base}/${asset}.sha256"

        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${asset}.sha256"
        else
          shasum -a 256 -c "${asset}.sha256"
        fi

        if [ "$ext" = "zip" ]; then
          if command -v unzip >/dev/null 2>&1; then
            unzip -oq "$asset"
          elif command -v 7z >/dev/null 2>&1; then
            7z x -y "$asset" >/dev/null
          else
            powershell.exe -NoProfile -Command "Expand-Archive -Force -LiteralPath '$asset' -DestinationPath '.'"
          fi
        else
          tar -xzf "$asset"
        fi

        # Archives unpack to mcp-loadtest-<tag>-<target>/mcp-loadtest[.exe]
        bin_dir="${dist}/mcp-loadtest-${tag}-${target}"
        if [ ! -f "${bin_dir}/mcp-loadtest" ] && [ ! -f "${bin_dir}/mcp-loadtest.exe" ]; then
          echo "::error::unexpected archive layout — no mcp-loadtest binary in ${bin_dir}"
          exit 1
        fi
        if [ "${RUNNER_OS}" = "Windows" ]; then
          cygpath -w "$bin_dir" >> "$GITHUB_PATH"
        else
          echo "$bin_dir" >> "$GITHUB_PATH"
        fi
        echo "installed mcp-loadtest ${tag} (${target})"

    - name: Run mcp-loadtest
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_BASELINE: ${{ inputs.baseline }}
      run: |
        # Establish fail-closed outputs before any validation or setup can
        # return early. Successful completion overwrites these values below.
        printf 'report-dir=\npassed=false\n' >> "$GITHUB_OUTPUT"

        case "${INPUT_COMMAND}" in
          run|deadlock-probe|cross|doctor) ;;
          *)
            echo "::error::unsupported command; expected deadlock-probe, run, cross, or doctor"
            exit 2
            ;;
        esac

        argv=(mcp-loadtest "${INPUT_COMMAND}")
        case "${INPUT_COMMAND}" in
          deadlock-probe|cross|doctor) argv+=(--server "${INPUT_SERVER}") ;;
          run) ;; # server comes from the TOML config passed via `args`
        esac

        # Decode a JSON string array into literal argv entries. The helper
        # emits a tagged NUL-delimited stream and never asks a shell to parse
        # caller-controlled text.
        # shellcheck source=scripts/action-args.sh
        source "${GITHUB_ACTION_PATH}/scripts/action-args.sh"
        if ! mcp_loadtest_append_json_args "${INPUT_ARGS:-[]}"; then
          echo "::error::args must be a JSON array containing only strings"
          exit 2
        fi

        if [ -n "${INPUT_BASELINE:-}" ]; then
          case "${INPUT_COMMAND}" in
            run|deadlock-probe) ;;
            *)
              echo "::error::baseline comparison requires run or deadlock-probe"
              exit 2
              ;;
          esac
        fi

        # The Action, not the caller or config, owns an empty per-invocation
        # root. The appended override is the only location eligible for report
        # attribution, eliminating stale/newest/set-difference races.
        if ! mcp_loadtest_prepare_report_target \
          "${INPUT_COMMAND}" \
          "${RUNNER_TEMP:-${TMPDIR:-/tmp}}" \
          "${argv[@]:2}"
        then
          echo "::error::could not prepare the Action-owned report directory"
          exit 2
        fi
        case "${INPUT_COMMAND}" in
          deadlock-probe|cross)
            argv+=(--output-dir "${MCP_LOADTEST_REPORT_ROOT}")
            ;;
          run)
            argv+=(--action-output-dir "${MCP_LOADTEST_REPORT_ROOT}")
            ;;
          doctor) ;;
        esac
        argv+=(--action-redact-server-identity)

        # The wrapper never echoes caller-controlled argv into workflow-command
        # syntax. CLI redaction is intentionally narrower (server identity and
        # malformed JSON diagnostics), so inputs still are not a secret store.
        echo "::group::mcp-loadtest ${INPUT_COMMAND}"
        status=0
        "${argv[@]}" || status=$?
        echo "::endgroup::"

        report_dir=""
        discovery_status=0
        if [ "${MCP_LOADTEST_REPORT_MODE}" != "none" ]; then
          if ! mcp_loadtest_collect_run_dirs "${MCP_LOADTEST_REPORT_ROOT}"; then
            echo "::error::could not enumerate reports in the Action-owned directory"
            discovery_status=1
          else
            run_dir_count="${#MCP_LOADTEST_RUN_DIRS[@]}"
            case "${MCP_LOADTEST_REPORT_MODE}" in
              single)
                if [ "$run_dir_count" -eq 1 ]; then
                  report_dir="${MCP_LOADTEST_RUN_DIRS[0]}"
                else
                  echo "::error::command did not create exactly one report in the Action-owned directory"
                  discovery_status=1
                fi
                ;;
              multiple)
                if [ "$run_dir_count" -ge 1 ]; then
                  report_dir="${MCP_LOADTEST_REPORT_ROOT}"
                else
                  echo "::error::cross did not create a report in the Action-owned directory"
                  discovery_status=1
                fi
                ;;
            esac
          fi
        fi

        compare_status=0
        compare_md=""
        if [ -n "${INPUT_BASELINE:-}" ]; then
          current="${report_dir}/metrics.json"
          if [ "$status" -ne 0 ] || [ "$discovery_status" -ne 0 ]; then
            echo "::error::baseline comparison skipped because the current invocation has no attributable report"
            compare_status=1
          elif [ -f "$current" ]; then
            compare_md="$(mcp-loadtest compare "${INPUT_BASELINE}" "$current" --format markdown)" || compare_status=$?
          else
            echo "::error::baseline set but this invocation did not produce metrics.json"
            compare_status=1
          fi
        fi

        passed=false
        if [ "$status" -eq 0 ] && [ "$discovery_status" -eq 0 ] && [ "$compare_status" -eq 0 ]; then
          passed=true
        fi

        {
          echo "## mcp-loadtest"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Command | \`${INPUT_COMMAND}\` |"
          echo "| Version | \`${MCP_LOADTEST_VERSION:-unknown}\` |"
          echo "| Result | **${passed}** (command ${status}; report ${discovery_status}; compare ${compare_status}) |"
          if [ -n "$report_dir" ]; then
            echo "| Report dir | \`${report_dir}\` |"
          else
            echo "| Report dir | _(none)_ |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$compare_md" ] || [ "$compare_status" -ne 0 ]; then
          {
            echo ""
            echo "### Baseline comparison (exit ${compare_status})"
            echo ""
            printf '%s\n' "$compare_md"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "${report_dir}/report.md" ]; then
          {
            echo ""
            echo "<details><summary>report.md</summary>"
            echo ""
            head -n 120 "${report_dir}/report.md"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        {
          echo "report-dir=${report_dir}"
          echo "passed=${passed}"
        } >> "$GITHUB_OUTPUT"

        # Explicit failure semantics: command, report attribution, and compare
        # are independent gates. Any non-zero result fails the caller's job.
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        if [ "$discovery_status" -ne 0 ]; then
          exit "$discovery_status"
        fi
        exit "$compare_status"
