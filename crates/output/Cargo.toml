[package]
name = "mcp-loadtest-output"
description = "Report renderers, grading, regression policy, and the live TUI for mcp-loadtest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Live-polling Ratatui dashboard. Only the CLI binary opts in.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
mcp-loadtest-core = { path = "../core", version = "0.0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
console = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[dev-dependencies]
insta = "1"
serde_json = { workspace = true }
ratatui = { workspace = true }

[[test]]
name = "tui_smoke"
required-features = ["tui"]
